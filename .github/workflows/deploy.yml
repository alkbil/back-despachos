name: CI/CD Backend Despachos

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build y Push imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: ./Springboot-API-REST-DESPACHO
          push: true
          tags: alkbil/backend-despachos-innovatech:latest

      - name: Desplegar en EC2-Backend vía bastión
        uses: appleboy/ssh-action@v1.0.0
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USERNAME }}
          DB_PASS: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          proxy_host: ${{ secrets.EC2_FRONTEND_HOST }}
          proxy_username: ec2-user
          proxy_key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_URL,DB_USER,DB_PASS
          script: |
            docker pull alkbil/backend-despachos-innovatech:latest
            docker stop backend-despachos || true
            docker rm backend-despachos || true
            docker run -d --name backend-despachos --restart always -p 8081:8081 -e SPRING_DATASOURCE_URL="$DB_URL" -e DB_USERNAME="$DB_USER" -e DB_PASSWORD="$DB_PASS" alkbil/backend-despachos-innovatech:latest
